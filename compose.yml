# daybook：单容器应用（后端 + 前端产物 + SQLite）
#
# **反代与 TLS 由你自己部署**（nginx / caddy 等），
# 反代目标：http://127.0.0.1:8090（见 DAYBOOK-DESIGN.zh-CN.md §7.1）。
#
# 与 Node 版的差别：不再有独立的 Postgres 服务。PocketBase 用的是内置 SQLite，
# 数据就是这个卷里的一个文件，备份/迁移都只需处理它。
#
# 用法（都在仓库根目录执行）：
#   cp deploy/daybook.env.example .env && 改里面的值
#   DAYBOOK_IMAGE=daybook:dev docker compose up -d
#   curl -s http://127.0.0.1:8090/healthz
#
# 首次部署后：浏览器打开 https://你的域名/_/ 建超级管理员，
# 然后在 users 集合里添加账号（注册是关闭的，账号只能这样加）。

services:
  app:
    image: ${DAYBOOK_IMAGE:-daybook:latest}
    build: .
    env_file:
      - .env
    environment:
      DAYBOOK_ADDR: 0.0.0.0:8090
      DAYBOOK_DATA_DIR: /app/pb_data
      DAYBOOK_PUBLIC_DIR: /app/pb_public
    ports:
      # 只绑本机回环：给宿主上的反代用；公网访问不到 8090
      - "127.0.0.1:8090:8090"
    volumes:
      # 数据库、上传文件与备份都在这一个卷里。
      # 换镜像/升级不会动它；备份也只需备份它。
      - pb_data:/app/pb_data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pb_data:
