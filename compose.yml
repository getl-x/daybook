# daybook：单容器应用（后端 + 前端产物 + SQLite）
#
# **反代与 TLS 由你自己部署**（nginx / caddy 等），
# 反代目标：http://127.0.0.1:8090（见 DAYBOOK-DESIGN.zh-CN.md §7.1）。
#
# 与 Node 版的差别：不再有独立的 Postgres 服务。PocketBase 用的是内置 SQLite，
# 数据就是这个卷里的一个文件，备份/迁移都只需处理它。
#
# 用法（都在仓库根目录执行）：
#   cp deploy/daybook.env.example .env && 改里面的值
#   DAYBOOK_IMAGE=daybook:dev docker compose up -d
#   curl -s http://127.0.0.1:8090/healthz
#   docker compose exec app daybook backup        # 立刻手工备一份，只回文件名
#
# 首次部署后：浏览器打开 https://你的域名/_/ 建超级管理员，
# 然后在 users 集合里添加账号（注册是关闭的，账号只能这样加）。

services:
  app:
    image: ${DAYBOOK_IMAGE:-daybook:latest}
    build: .
    env_file:
      - .env
    environment:
      DAYBOOK_ADDR: 0.0.0.0:8090
      DAYBOOK_DATA_DIR: /app/pb_data
      DAYBOOK_PUBLIC_DIR: /app/pb_public
      # Go 的内存软上限：不设的话 Go 按宿主总内存推算 GC 目标，
      # 在小 VPS 上容易在别人吃紧时被 OOM kill。
      GOMEMLIMIT: ${GOMEMLIMIT:-384MiB}
      # 只影响日志时间戳这类本地时间；"日记日"用的是每个用户自己的时区设置，
      # 定时任务走 UTC（PocketBase 的 cron 默认时区）。
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 只绑本机回环：给宿主上的反代用；公网访问不到 8090
      - "127.0.0.1:8090:8090"
    volumes:
      # 数据库、上传文件与备份都在这一个卷里。
      # 换镜像/升级不会动它；备份也只需备份它。
      - pb_data:/app/pb_data
    restart: unless-stopped

    # ---------------------------- 加固 ----------------------------
    # 只读根文件系统：应用唯一需要写的地方就是上面那个卷，外加 /tmp。
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # 应用不需要任何 capability（不绑特权端口、不动网络栈），全丢。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 退出时可能要写完一个备份或收尾一次迁移，给足时间再 SIGKILL。
    stop_grace_period: 30s
    # 健康检查由镜像自己声明（Dockerfile 里的 HEALTHCHECK 调 `daybook healthcheck`）。
    # 这里刻意不重复写一遍：两份配置最容易悄悄漂移，而漂移之后"哪个才算数"很难查。

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pb_data:
