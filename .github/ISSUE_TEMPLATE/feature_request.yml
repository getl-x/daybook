name: ✨ Feature request / 功能建议
description: Suggest an idea. 提一个需求（可以用中文写）。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提建议！请先说清楚你想解决的问题，再说方案。
        **可以用中文写。**
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 你遇到了什么困难或不便？现在的做法为什么不够用？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望它怎么做？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 你还考虑过哪些别的做法？（可选）
    validations:
      required: false
