name: Publish Docker image
run-name: daybook ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }} · 镜像

# 触发时机：打 v* 标签，或手动指定标签。
# 推镜像前先用 compose 把构建出的镜像真跑一遍
# （healthz / 登录 / 静态产物 / CLI / 非 root），有问题就不发。
#
# 推到两个仓库（同一次构建、同名标签）：
#   - ghcr.io/getl-x/daybook            （用 GITHUB_TOKEN，无需配置）
#   - docker.io/<用户名>/daybook        （需要仓库变量 DOCKERHUB_USERNAME + secret DOCKERHUB_TOKEN；
#     缺任一就只推 GHCR 并给个 warning，不会让流程失败）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 镜像标签（手动触发用）
        required: true
        default: edge

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      SMOKE_IMAGE: daybook:ci
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # 算出这次推到哪些仓库：GHCR 一定有；Docker Hub 只在用户名 + token 都配了时才加进去。
      - name: Decide target registries
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          images="$GHCR_IMAGE"
          dockerhub=false
          if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            images="${images}"$'\n'"docker.io/${DOCKERHUB_USERNAME}/daybook"
            dockerhub=true
            echo "Docker Hub 目标：docker.io/${DOCKERHUB_USERNAME}/daybook"
          else
            echo "::warning::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN 没配全，这次只推 GHCR（配法见 docs/zh-CN/operations.md §12）"
          fi
          echo "dockerhub=${dockerhub}" >> "$GITHUB_ENV"
          {
            echo "images<<__IMAGES__"
            echo "${images}"
            echo "__IMAGES__"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 冒烟用的 .env：compose.yml 的 env_file 指向它，缺文件 compose 会直接报错，
      # 所以必须写一个（真实部署由使用者自己填，见 deploy/daybook.env.example）。
      # Go 版只认 DAYBOOK_*；Node 版的 POSTGRES_PASSWORD / JWT_SECRET / PORT /
      # NODE_ENV / LOG_LEVEL 一个都不再被读取。
      # DAYBOOK_VERSION 会被 /healthz 回显成 appVersion，下面据此确认这份配置真的进了容器。
      - name: Write throwaway .env for the smoke test
        shell: bash
        run: |
          set -euo pipefail
          cat > .env <<'ENVEOF'
          DAYBOOK_VERSION=ci-smoke
          ENVEOF

      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.SMOKE_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image (compose)
        shell: bash
        env:
          DAYBOOK_IMAGE: ${{ env.SMOKE_IMAGE }}
        run: |
          set -euo pipefail
          cleanup() { docker compose logs --no-color app || true; docker compose down -v || true; }
          trap cleanup EXIT

          DAYBOOK_IMAGE="$SMOKE_IMAGE" docker compose up -d --quiet-pull

          code=""
          for _ in $(seq 1 45); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/healthz || true)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "healthz 期望 200，实际 $code" >&2
            exit 1
          fi

          # /healthz 要回显 .env 里的 DAYBOOK_VERSION：证明这份配置真的进了容器，
          # 而不是镜像里写死的默认值 dev。
          healthz="$(curl -s http://127.0.0.1:8090/healthz)"
          case "$healthz" in
            *'"appVersion":"ci-smoke"'*) ;;
            *) echo "healthz 未回显 appVersion=ci-smoke：$healthz" >&2; exit 1 ;;
          esac

          # 迁移真的跑过：登录要查 users 集合（auth.Login 里的 FindFirstRecordByData），
          # 集合不存在时报的是 500 而不是 401，所以这条 401 就是迁移已应用过的证据。
          login="$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -d '{"username":"__ci_probe__","password":"x"}' \
            http://127.0.0.1:8090/v1/auth/login)"
          [ "$login" = "401" ] || { echo "/v1/auth/login 期望 401，实际 $login" >&2; exit 1; }

          # 前端产物真的挂上了：index.html 与 web/public 下的文件都从 /app/pb_public 提供
          root="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/)"
          [ "$root" = "200" ] || { echo "/ 期望 200（前端产物没挂上？），实际 $root" >&2; exit 1; }
          manifest="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/manifest.webmanifest)"
          [ "$manifest" = "200" ] || { echo "/manifest.webmanifest 期望 200，实际 $manifest" >&2; exit 1; }

          # 缺失的资源必须 404（不能回 SPA 的 200 HTML）；受保护接口必须 401
          assets="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/assets/does-not-exist.js)"
          [ "$assets" = "404" ] || { echo "/assets/* 期望 404，实际 $assets" >&2; exit 1; }
          meta="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/v1/meta/timezones)"
          [ "$meta" = "401" ] || { echo "/v1/meta/timezones 期望 401，实际 $meta" >&2; exit 1; }
          spa="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/day/2026-01-01)"
          [ "$spa" = "200" ] || { echo "SPA 路径期望 200，实际 $spa" >&2; exit 1; }

          # CLI 在镜像里可用（Go 版是 /usr/local/bin/daybook，见 Dockerfile）；
          # migrate 子命令由 main.go 的 migratecmd 注册，一起确认它挂上了。
          docker compose exec -T app daybook --help >/dev/null
          docker compose exec -T app daybook migrate --help >/dev/null

          # 非 root 运行
          uid="$(docker run --rm --entrypoint sh "$SMOKE_IMAGE" -c 'id -u')"
          [ "$uid" = "10001" ] || { echo "容器应以 uid 10001 运行，实际 $uid" >&2; exit 1; }

          echo "冒烟通过：healthz 200(appVersion 已回显) / 登录 401 / 前端产物 200 / assets 404 / 受保护接口 401 / SPA 200 / CLI 可用 / 非 root uid=$uid"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-

      # 只出 linux/amd64：目标是你自己的 VPS。要加 arm64 就在 platforms 里补上（会慢不少）。
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        shell: bash
        run: |
          {
            echo "### daybook 镜像已发布"
            echo
            echo '```'
            echo "${{ steps.metadata.outputs.tags }}"
            echo '```'
            echo
            echo "VPS 上拉取："
            echo
            echo '```bash'
            echo "docker pull $(echo "${{ steps.metadata.outputs.tags }}" | head -1)"
            echo '```'
            if [ "${dockerhub:-false}" != "true" ]; then
              echo
              echo "> 这次没推 Docker Hub：仓库变量 \`DOCKERHUB_USERNAME\` 与 secret \`DOCKERHUB_TOKEN\` 没配全。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
