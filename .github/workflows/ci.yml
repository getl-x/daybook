name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (server)
        run: npm run typecheck -w @daybook/server
      - name: Typecheck (web)
        run: npm run typecheck -w @daybook/web
      - name: Test (shared + server)
        run: npm test
      - name: Build (web)
        run: npm run build -w @daybook/web
